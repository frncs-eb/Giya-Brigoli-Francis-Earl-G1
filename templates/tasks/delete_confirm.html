{% extends "base.html" %}

{% block title %}Delete Task | Giya{% endblock %}

{% block content %}
<main>
  <section class="card">
    <h1>Delete task?</h1>
    <p>Delete <strong>{{ task.title }}</strong> for {{ task.course }}?</p>
    <form method="post" action="{% url 'tasks:delete' task.pk %}">
      {% csrf_token %}<input type="hidden" name="next" value="{{ next }}">
      <button type="submit">Delete task</button>
      <a href="{% url 'tasks:home' %}">Cancel</a>
    </form>
  </section>
</main>
{% endblock %}
