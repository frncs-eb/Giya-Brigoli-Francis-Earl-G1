{% extends "base.html" %}

{% block title %}{{ title }} | Giya{% endblock %}

{% block content %}
<main>
  <section class="card">
    <h1>{{ title }}</h1>
    <form method="post">
      {% csrf_token %}
      {{ form.non_field_errors }}
      {% for field in form %}
        <label for="{{ field.id_for_label }}">{{ field.label }}</label>
        {{ field }}
        {{ field.errors }}
      {% endfor %}
      <button class="submit" type="submit">Save allowance</button>
    </form>
    <p><a href="{% if allowance %}{% url 'budget:allowance_detail' allowance.pk %}{% else %}{% url 'budget:home' %}{% endif %}">Cancel</a></p>
  </section>
</main>
{% endblock %}
