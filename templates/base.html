<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Giya{% endblock %}</title>
  <style>
    :root { color-scheme: light; font-family: Arial, sans-serif; color: #18332b; background: #f3f7f4; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; }
    header { display: flex; justify-content: space-between; align-items: center; padding: 1rem max(1.25rem, calc((100% - 960px) / 2)); background: #fff; border-bottom: 1px solid #dfe9e2; }
    a { color: #176b4a; }
    .brand { font-size: 1.25rem; font-weight: 700; text-decoration: none; }
    nav { display: flex; align-items: center; gap: 1rem; }
    nav form { margin: 0; }
    main { width: min(100% - 2rem, 960px); margin: 3rem auto; }
    .card { width: min(100%, 440px); margin: 0 auto; padding: 2rem; background: #fff; border: 1px solid #dfe9e2; border-radius: 12px; box-shadow: 0 8px 24px #18332b0d; }
    .card.wide { width: 100%; }
    h1 { margin-top: 0; }
    label { display: block; margin: 1rem 0 .4rem; font-weight: 600; }
    input { width: 100%; padding: .75rem; border: 1px solid #b9c9bf; border-radius: 6px; font: inherit; }
    button { padding: .75rem 1rem; border: 0; border-radius: 6px; background: #176b4a; color: #fff; font: inherit; font-weight: 700; cursor: pointer; }
    button:hover { background: #10563b; }
    .submit { width: 100%; margin-top: 1.25rem; }
    .errorlist { padding-left: 1.25rem; color: #a32626; }
    .helptext { display: block; margin-top: .35rem; color: #5e7065; font-size: .875rem; }
    .form-errors { color: #a32626; }
    .muted { color: #5e7065; }
    @media (max-width: 480px) { header { align-items: flex-start; gap: 1rem; } nav { flex-wrap: wrap; justify-content: flex-end; } .card { padding: 1.4rem; } }
  </style>
</head>
<body>
  <header>
    <a class="brand" href="{% if user.is_authenticated %}{% url 'dashboard:home' %}{% else %}{% url 'accounts:login' %}{% endif %}">Giya</a>
    <nav>
      {% if user.is_authenticated %}
        <span>{{ user.username }}</span>
        <form method="post" action="{% url 'accounts:logout' %}">
          {% csrf_token %}
          <button type="submit">Log out</button>
        </form>
      {% else %}
        <a href="{% url 'accounts:login' %}">Log in</a>
        <a href="{% url 'accounts:register' %}">Create account</a>
      {% endif %}
    </nav>
  </header>
  {% block content %}{% endblock %}
</body>
</html>
